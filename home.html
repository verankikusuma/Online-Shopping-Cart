<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Home Page</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #f4f4f4; }
        .container { max-width: 1200px; margin: 0 auto; display: flex; }
        .categories { display: flex; flex-direction: column; gap: 10px; margin-right: 20px; }
        .category { padding: 10px 20px; background: #fff; border: 1px solid #ddd; border-radius: 5px; cursor: pointer; text-align: center; box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1); }
        .products { display: flex; gap: 20px; flex-wrap: wrap; }
        .product-card { background: #fff; border: 1px solid #ddd; border-radius: 5px; padding: 10px; text-align: center; box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1); width: 150px; }
        .product-card img { width: 100px; height: auto; border-radius: 5px; }
        .cart { margin-left: 20px; background: #fff; border: 1px solid #ddd; border-radius: 5px; padding: 10px; width: 300px; box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1); }
        .cart h2 { text-align: center; }
    </style>
    <script>
        let totalPrice = 0;
        function addToCart(product, price) {
            const cartList = document.getElementById('cart-items');
            const item = document.createElement('li');
            item.textContent = `${product} - $${price}`;
            cartList.appendChild(item);
            totalPrice += price;
            document.getElementById('total-price').textContent = `Total: $${totalPrice}`;
        }
    </script>
</head>
<body>
    <div class="container">
        <div class="categories">
            <div class="category" onclick="location.href='mens.html'">Men's Wear</div>
            <div class="category" onclick="location.href='womens.html'">Women's Wear</div>
            <div class="category" onclick="location.href='footwear.html'">Footwear</div>
            <div class="category" onclick="location.href='accessories.html'">Accessories</div>
            <div class="category" onclick="location.href='jewellery.html'">Jewellery</div>
            <div class="category" onclick="location.href='kitchen.html'">Kitchen</div>
            <div class="category" onclick="location.href='children.html'">Children</div>
        </div>
        <div class="products">
            <h2>Recommended Products</h2>
            <div class="product-card">
                <img src="product1.jpg" alt="Product 1">
                <p>Product 1 - $20</p>
                <button onclick="addToCart('Product 1', 20)">Add to Cart</button>
            </div>
            <div class="product-card">
                <img src="product2.jpg" alt="Product 2">
                <p>Product 2 - $25</p>
                <button onclick="addToCart('Product 2', 25)">Add to Cart</button>
            </div>
            <div class="product-card">
                <img src="product3.jpg" alt="Product 3">
                <p>Product 3 - $30</p>
                <button onclick="addToCart('Product 3', 30)">Add to Cart</button>
            </div>
            <div class="product-card">
                <img src="product4.jpg" alt="Product 4">
                <p>Product 4 - $15</p>
                <button onclick="addToCart('Product 4', 15)">Add to Cart</button>
            </div>
            <div class="product-card">
                <img src="product5.jpg" alt="Product 5">
                <p>Product 5 - $40</p>
                <button onclick="addToCart('Product 5', 40)">Add to Cart</button>
            </div>
            <div class="product-card">
                <img src="product6.jpg" alt="Product 6">
                <p>Product 6 - $18</p>
                <button onclick="addToCart('Product 6', 18)">Add to Cart</button>
            </div>
            <div class="product-card">
                <img src="product7.jpg" alt="Product 7">
                <p>Product 7 - $22</p>
                <button onclick="addToCart('Product 7', 22)">Add to Cart</button>
            </div>
            <div class="product-card">
                <img src="product8.jpg" alt="Product 8">
                <p>Product 8 - $28</p>
                <button onclick="addToCart('Product 8', 28)">Add to Cart</button>
            </div>
            <div class="product-card">
                <img src="product9.jpg" alt="Product 9">
                <p>Product 9 - $35</p>
                <button onclick="addToCart('Product 9', 35)">Add to Cart</button>
            </div>
            <div class="product-card">
                <img src="product10.jpg" alt="Product 10">
                <p>Product 10 - $50</p>
                <button onclick="addToCart('Product 10', 50)">Add to Cart</button>
            </div>
        </div>
        <h2>Your Cart</h2>
    <ul id="cart-items"></ul>
    <h3>Total: ₹<span id="cart-total">0</span></h3>
    <a href="cart.html"><button>Go to Cart</button></a>
    <script src="script.js"></script>
</body>
</html>
