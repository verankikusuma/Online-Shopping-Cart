<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Jewellery Section</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            text-align: center;
        }
        .categories {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 20px 0;
        }
        .category {
            padding: 10px 20px;
            background: pink;
            border: 1px solid #ccc;
            cursor: pointer;
            border-radius: 5px;
        }
        .products {
            display: flex;
            justify-content: space-around;
            margin-top: 20px;
        }
        .product-card {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            width: 200px;
            background: pink;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        .product-card img {
            width: 100%;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Jewellery Section</h1>
        <div class="categories">
            <div class="category" onclick="displayProducts('necklace')">Necklaces</div>
            <div class="category" onclick="displayProducts('bracelet')">Bracelets</div>
            <div class="category" onclick="displayProducts('earrings')">Earrings</div>
        </div>
        <div id="product-list" class="products"></div>
        <br>
        <a href="index.html">Back to Home</a>
    </div>

    <script>
        const jewelleryProducts = {
            necklace: [
                { name: 'Necklace', price: 'Rs.100', image: 'images/necklace1.jpg' },
                { name: 'Necklace', price: 'RS.120', image: 'images/necklace2.jpg' },
                { name: 'Necklace', price: 'Rs.90', image: 'images/necklace3.jpg' }
            ],
            bracelet: [
                { name: 'Bracelet', price: 'Rs.60', image: 'images/bracelet1.jpg' },
                { name: 'Bracelet', price: 'Rs.70', image: 'images/bracelet2.jpg' },
                { name: 'Bracelet', price: 'Rs.80', image: 'images/bracelet3.jpg' }
            ],
            earrings: [
                { name: 'Earrings', price: 'Rs.50', image: 'images/earrings1.jpg' },
                { name: 'Earrings', price: 'Rs.60', image: 'images/earrings2.jpg' },
                { name: 'Earrings', price: 'Rs.55', image: 'images/earrings3.jpg' }
            ]
        };

        function displayProducts(category) {
            const productList = document.getElementById('product-list');
            productList.innerHTML = '';
            jewelleryProducts[category].forEach(product => {
                const productCard = document.createElement('div');
                productCard.className = 'product-card';
                productCard.innerHTML = `
                    <img src="${product.image}" alt="${product.name}">
                    <h3>${product.name}</h3>
                    <p>${product.price}</p>
                    <button onclick="addtocart('${product.name}')">AddToCart</button>
                 `;
                productList.appendChild(productCard);
            });
        }
        function addtocart(product) {
            let likedProducts = JSON.parse(sessionStorage.getItem('likedProducts')) || [];
            likedProducts.push(product);
            sessionStorage.setItem('likedProducts', JSON.stringify(likedProducts));
            alert(`${product.name} added to cart products!`);
        }

        
    </script>
</body>
</html>
