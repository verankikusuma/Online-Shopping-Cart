<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Men's Wear</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: pink;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .categories {
            display: flex;
            gap: 20px;
            margin-top: 20px;
        }
        .category {
            background: #fff;
            border: 1px solid #ddd;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        .product-card {
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 150px;
        }
        .product-card img {
            width: 100px;
            height: auto;
            border-radius: 5px;
        }
        .products {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            margin-top: 20px;
        }
        .cart-link {
            display: block;
            margin-top: 20px;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Men's Wear</h1>
        <nav>
            <a href="index.html">Back to Home</a>
        </nav>
        <h2>Select Category</h2>
        <div class="categories">
            <div class="category" onclick="displayProducts('watches')">Watches</div>
            <div class="category" onclick="displayProducts('shirts')">Shirts</div>
            <div class="category" onclick="displayProducts('shoes')">Shoes</div>
        </div>
        <div class="products" id="product-list"></div>

        <!-- Add Cart Link -->
        <a href="cart.html" class="cart-link">Go to Cart</a>
    </div>

    <script>
        const products = {
            watches: [
                { name: "TITAN", price: 999, image: "images/watch1.jpg" },
                { name: "SPORT WATCH", price: 899, image: "images/watch2.jpg" },
                { name: "LEATHER WATCH", price: 1999, image: "images/watch3.jpg" }
            ],
            shirts: [
                { name: "CHECK SHIRT", price: 300, image: "images/shirt1.jpg" },
                { name: "FLORAL SHIRT", price: 400, image: "images/shirt2.jpg" },
                { name: "FORMAL SHIRT", price: 500, image: "images/shirt3.jpg" }
            ],
            shoes: [
                { name: "ATHLEISURE", price: 800, image: "images/shoe1.jpg" },
                { name: "LEONE SLIP", price: 900, image: "images/shoe2.jpg" },
                { name: "CASUAL SHOES", price: 999, image: "images/shoe3.jpg" }
            ]
        };
        
        function displayProducts(category) {
            const productList = document.getElementById('product-list');
            productList.innerHTML = ''; // Clear previous products
        
            products[category].forEach(product => {
                const productCard = document.createElement('div');
                productCard.className = 'product-card';
                productCard.innerHTML = `
                    <img src="${product.image}" alt="${product.name}">
                    <p>${product.name} - Rs.${product.price}</p>
                    <button onclick="addToCart('${product.name}', ${product.price})">Add To Cart</button>
                `;
                productList.appendChild(productCard);
            });
        }
        
        function addToCart(name, price) {
            let cart = JSON.parse(localStorage.getItem('cart')) || [];
            cart.push({ name, price });
            localStorage.setItem('cart', JSON.stringify(cart));
            alert(`${name} added to cart!`);
        }
        
    </script>
</body>
</html>
