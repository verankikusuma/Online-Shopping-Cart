
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Footwear</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: pink;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .categories {
            display: flex;
            flex-direction: row;
            gap: 10px;
            margin-bottom: 20px;
        }
        .category-button {
            padding: 10px;
            background: purple;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-align: center;
        }
        .product-list {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }
        .product-card {
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 150px;
        }
        .product-card img {
            width: 100px;
            height: auto;
            border-radius: 5px;
        }
        .like-button {
            margin-top: 10px;
            padding: 5px 10px;
            background: purple;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Footwear Collection</h1>
        <div class="categories">
            <button class="category-button" onclick="showProducts('men')">Men</button>
            <button class="category-button" onclick="showProducts('women')">Women</button>
            <button class="category-button" onclick="showProducts('children')">Children</button>
        </div>
        <div class="product-list" id="product-list"></div>
    </div>

    <script>
        const products = {
            men: [
                { name: 'Men Sneakers', price: 'Rs.500', image: 'images/sneakers.jpg' },
                { name: 'Men Loafers', price: 'Rs.600', image: 'images/loafers.jpg' },
                { name: 'Men Boots', price: 'Rs.800', image: 'images/boots.jpg' }
            ],
            women: [
                { name: 'Women Heels', price: '$70', image: 'images/heels.jpg' },
                { name: 'Women Flats', price: '$40', image: 'images/flats.jpg' },
                { name: 'Women Sneakers', price: '$60', image: 'images/womensneakers.jpg' }
            ],
            children: [
                { name: 'Kids Sandals', price: '$30', image: 'images/sandals.jpg' },
                { name: 'Kids Sneakers', price: '$40', image: 'images/kidsneakers.jpg' },
                { name: 'Kids Boots', price: '$50', image: 'images/kidsboots.jpg' }
            ]
        };

        function showProducts(category) {
            const productList = document.getElementById('product-list');
            productList.innerHTML = '';
            products[category].forEach(product => {
                const productCard = document.createElement('div');
                productCard.className = 'product-card';
                productCard.innerHTML = `
                    <img src="${product.image}" alt="${product.name}">
                    <p>${product.name} - ${product.price}</p>
                    <button class="addtocart-button" onclick='addtocart(${JSON.stringify(product)})'>AddToCart</button>
                `;
                productList.appendChild(productCard);
            });
        }

        function addtocart(product) {
            let likedProducts = JSON.parse(sessionStorage.getItem('likedProducts')) || [];
            likedProducts.push(product);
            sessionStorage.setItem('likedProducts', JSON.stringify(likedProducts));
            alert(`${product.name} has been added to cart products!`);
        }
    </script>
</body>
</html>
